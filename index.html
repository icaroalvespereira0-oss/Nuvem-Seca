<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuvem Seca • Vídeo Animado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #05070d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .tela-reels {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: linear-gradient(180deg, #070b14 0%, #111827 65%, #1f1209 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tremer {
            animation: tremor 0.4s ease-in-out;
        }
        @keyframes tremor {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 4px); }
            40% { transform: translate(6px, -4px); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(4px, 2px); }
        }
        .flash-verde {
            position: absolute;
            inset: 0;
            background: rgba(34, 197, 94, 0.25);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .topo { padding: 24px 20px 0; text-align: center; z-index: 10; }
        .data { font-size: 12px; letter-spacing: 2px; color: #cbd5e1; margin-bottom: 4px; }
        .relogio { font-family: 'Arial Black', sans-serif; font-size: 46px; letter-spacing: 2px; text-shadow: 0 4px 12px #000; }
        .badge {
            display: inline-block;
            background-color: #ea580c;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 20px;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .cenario { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Animação contínua da serpente */
        #criatura {
            transform: translateX(-280px);
            transition: transform 2.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .ondular {
            animation: ondaCorpo 2s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes ondaCorpo {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-9px) rotate(-2deg); }
        }
        .lingua-anim {
            animation: linguaBate 0.8s infinite;
            transform-origin: 312px 322px;
        }
        @keyframes linguaBate {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(1.35); }
        }
        .led-azul { animation: pulsarLed 0.9s infinite; }
        @keyframes pulsarLed {
            0%, 100% { opacity: 1; r: 6; }
            50% { opacity: 0.4; r: 8; }
        }

        .base {
            padding: 20px 24px 36px;
            text-align: center;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.65) 70%, transparent 100%);
        }
        .barra-progresso {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        #barra-preenchida {
            width: 0%;
            height: 100%;
            background: #22c55e;
            transition: width 0.3s linear;
        }
        .legenda {
            font-family: 'Arial Black', sans-serif;
            font-size: 23px;
            line-height: 1.25;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 0 4px 15px #000;
            min-height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .btn-acao {
            background: #ea580c;
            border: none;
            color: #fff;
            padding: 16px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(234, 88, 12, 0.5);
        }
    </style>
</head>
<body>

<div class="tela-reels" id="palco">
    <div class="flash-verde" id="flash"></div>

    <svg class="cenario" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
        <defs>
            <filter id="neon-verde" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="7" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="neon-azul" x="-50%" y="-50%" width="200%" height="200%">

        <!-- SERPENTE COM MOVIMENTO -->
        <g id="criatura">

                <circle cx="285" cy="316" r="6" fill="#38bdf8" filter="url(#neon-azul)" class="led-azul"/>

            </g>

        <!-- TELHADO -->
        <g transform="rotate(-11 200 580)">

                <circle cx="10" cy="545" r="22"/><circle cx="55" cy="545" r="22"/><circle cx="100" cy="545" r="22"/>
                <circle cx="145" cy="545" r="22"/><circle cx="190" cy="545" r="22"/><circle cx="235" cy="545" r="22"/>
                <circle cx="280" cy="545" r="22"/><circle cx="325" cy="545" r="22"/><circle cx="370" cy="545" r="22"/>
                <circle cx="35" cy="585" r="22"/><circle cx="80" cy="585" r="22"/><circle cx="125" cy="585" r="22"/>
                <circle cx="170" cy="585" r="22"/><circle cx="215" cy="585" r="22"/><circle cx="260" cy="585" r="22"/>
                <circle cx="305" cy="585" r="22"/><circle cx="350" cy="585" r="22"/><circle cx="395" cy="585" r="22"/>
            </g>
        </g>
    </svg>

    <div class="topo">
        <div class="data">● MADRUGADA DE LUA NOVA</div>
        <div class="relogio" id="relogio-texto">00:00</div>
        <div class="badge">NUVEM SECA • PARTE 1</div>
    </div>

    <div class="base">
        <div class="barra-progresso"><div id="barra-preenchida"></div></div>
        <div class="legenda" id="legenda-texto">APERTE PLAY PARA ASSISTIR</div>
        <button class="btn-acao" id="btn-play" onclick="iniciarVideo()">▶ ASSISTIR EPISÓDIO</button>
    </div>
</div>
