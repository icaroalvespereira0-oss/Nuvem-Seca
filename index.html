<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuvem Seca • O Boitatá de Silício</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #05070d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .tela-reels {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: linear-gradient(180deg, #070b14 0%, #111827 65%, #1f1209 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* TOPO */
        .topo { padding: 24px 20px 0; text-align: center; z-index: 10; }
        .data { font-size: 12px; letter-spacing: 2px; color: #cbd5e1; margin-bottom: 4px; }
        .relogio { font-family: 'Arial Black', sans-serif; font-size: 46px; letter-spacing: 2px; text-shadow: 0 4px 12px #000; }
        .badge {
            display: inline-block;
            background-color: #ea580c;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 20px;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        /* CENÁRIO */
        .cenario { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        .serpente { animation: rastejar 3s ease-in-out infinite; transform-origin: center; }
        @keyframes rastejar {
            0%, 100% { transform: translateY(0px) skewX(0deg); }
            50% { transform: translateY(-7px) skewX(-2deg); }
        }
        .led-azul { animation: pulsarLed 1.5s infinite; }
        @keyframes pulsarLed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        /* BASE E LEGENDAS */
        .base {
            padding: 20px 24px 36px;
            text-align: center;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.65) 70%, transparent 100%);
        }
        .barra-progresso { display: flex; gap: 6px; margin-bottom: 16px; }
        .traco { flex: 1; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; }
        .traco.ativo { background: #22c55e; }
        .legenda {
            font-family: 'Arial Black', sans-serif;
            font-size: 22px;
            line-height: 1.25;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 0 4px 15px #000;
            min-height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }
        .btn-acao {
            background: #ea580c;
            border: none;
            color: #fff;
            padding: 15px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4);
        }
        .btn-acao:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="tela-reels" onclick="proximaCena()">
    <!-- CENÁRIO COM O BOITATÁ DE SILÍCIO NO TELHADO -->
    <svg class="cenario" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
        <defs>
            <filter id="neon-verde" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="7" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="neon-azul" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Estrelas -->
        <circle cx="55" cy="130" r="1.5" fill="#fff" opacity="0.6"/>
        <circle cx="150" cy="85" r="2" fill="#fff" opacity="0.8"/>
        <circle cx="280" cy="115" r="1.5" fill="#fff" opacity="0.5"/>
        <circle cx="340" cy="200" r="2" fill="#fff" opacity="0.7"/>

        <!-- Lua Nova / Minguante -->
        <path d="M 310 145 A 36 36 0 1 1 285 210 A 28 28 0 1 0 310 145 Z" fill="#fef08a" opacity="0.85"/>

        <!-- SERPENTE BOITATÁ DE SILÍCIO -->
        <g class="serpente" id="criatura">
            <!-- Corpo de fogo/código verde néon -->
            <path d="M 40 530 Q 95 450, 145 480 T 220 390 T 265 310 L 315 305 L 305 335 L 255 340 Q 225 425, 165 495 T 60 550 Z" 
                  fill="#051b11" stroke="#22c55e" stroke-width="4" filter="url(#neon-verde)"/>
            
            <!-- Linhas de circuito dentro do corpo -->
            <path d="M 90 500 L 135 485 L 185 420 L 245 325" stroke="#4ade80" stroke-width="2" stroke-dasharray="6,6" fill="none"/>

            <!-- Língua bifurcada de energia -->
            <path d="M 312 322 L 340 318 L 352 310 M 340 318 L 350 328" stroke="#f97316" stroke-width="2.5" fill="none"/>

            <!-- Olhos de LED Azul -->
            <circle cx="285" cy="316" r="6" fill="#38bdf8" filter="url(#neon-azul)" class="led-azul"/>
            <circle cx="285" cy="316" r="2.5" fill="#ffffff"/>
        </g>

        <!-- TELHADO DE BARRO DO SERTÃO -->
        <g transform="rotate(-11 200 580)">
            <rect x="-50" y="510" width="520" height="350" fill="#3b2314"/>
            <rect x="-50" y="510" width="520" height="14" fill="#5c3822"/>
            <g fill="#4a2c18" stroke="#26150a" stroke-width="2">
                <circle cx="10" cy="545" r="22"/><circle cx="55" cy="545" r="22"/><circle cx="100" cy="545" r="22"/>
                <circle cx="145" cy="545" r="22"/><circle cx="190" cy="545" r="22"/><circle cx="235" cy="545" r="22"/>
                <circle cx="280" cy="545" r="22"/><circle cx="325" cy="545" r="22"/><circle cx="370" cy="545" r="22"/>
                <circle cx="35" cy="585" r="22"/><circle cx="80" cy="585" r="22"/><circle cx="125" cy="585" r="22"/>
                <circle cx="170" cy="585" r="22"/><circle cx="215" cy="585" r="22"/><circle cx="260" cy="585" r="22"/>
                <circle cx="305" cy="585" r="22"/><circle cx="350" cy="585" r="22"/><circle cx="395" cy="585" r="22"/>
            </g>
        </g>
    </svg>

    <!-- TOPO -->
    <div class="topo">
        <div class="data">● MADRUGADA DE LUA NOVA</div>
        <div class="relogio" id="relogio-texto">00:00</div>
        <div class="badge">NUVEM SECA • PARTE 1</div>
    </div>

    <!-- LEGENDAS E BOTÃO -->
    <div class="base">
        <div class="barra-progresso" id="progresso"></div>
        <div class="legenda" id="legenda-texto">QUANDO O SOL RACHA O SERTÃO E A INTERNET CAI...</div>
        <button class="btn-acao" id="btn-texto" onclick="event.stopPropagation(); proximaCena()">▶ COMEÇAR (COM SOM)</button>
    </div>
</div>

<script>
    const cenas = [
        { hora: "00:00", texto: "QUANDO O SOL RACHA O SERTÃO E A INTERNET CAI...", btn: "TOQUE PARA CONTINUAR ➔", scale: "scale(1)" },
        { hora: "00:04", texto: "NÃO É PROBLEMA NA TORRE. É O BOITATÁ DE SILÍCIO.", btn: "CONTINUAR ➔", scale: "scale(1.08)" },
        { hora: "00:09", texto: "ELE DESLIZA PELOS CABOS DE FIBRA ÓTICA NA MADRUGADA...", btn: "CONTINUAR ➔", scale: "scale(1.15)" },
        { hora: "00:14", texto: "COM OLHOS DE LED AZUL QUE FRITAM A PLACA DE QUEM ESPALHA MENTIRA.", btn: "CONTINUAR ➔", scale: "scale(1.22)" },
        { hora: "00:19", texto: "MAS PARA QUEM AJUDA O POVO... ELE ZERA O PING NUM PISCAR DE OLHOS.", btn: "ASSISTIR DE NOVO ↻", scale: "scale(1.28)" }
    ];

    let indice = 0;
    let somLigado = false;

    function ligarSom() {
        if (somLigado) return;
        somLigado = true;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(55, ctx.currentTime);
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(140, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
        } catch(e) {}
    }

    function atualizarBarras() {
        const cont = document.getElementById('progresso');
        cont.innerHTML = '';
        cenas.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = 'traco' + (i <= indice ? ' ativo' : '');
            cont.appendChild(div);
        });
    }

    function proximaCena() {
        ligarSom();
        indice = (indice + 1) % cenas.length;
        const atual = cenas[indice];
        document.getElementById('relogio-texto').innerText = atual.hora;
        document.getElementById('legenda-texto').innerText = atual.texto;
        document.getElementById('btn-texto').innerText = atual.btn;
        document.getElementById('criatura').style.transform = atual.scale;
        document.getElementById('criatura').style.transition = "transform 1.2s ease";
        atualizarBarras();
    }

    atualizarBarras();
</script>
</body>
</html>
